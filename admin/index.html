<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Surg admin</title>
<style>body{font:15px/1.5 system-ui;background:#000;color:#fff;max-width:720px;margin:0 auto;padding:16px}input,button{font:inherit;padding:9px 12px;border-radius:10px;border:1px solid #333;background:#111;color:#fff}button{cursor:pointer}.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}pre{background:#0b0b0b;border:1px solid #2b2b2b;border-radius:12px;padding:12px;white-space:pre-wrap;overflow-wrap:anywhere}.fb{border-top:1px solid #2b2b2b;padding:10px 0}.fb small{color:#b4b4b4}</style></head><body>
<h1>Surg admin</h1><p>The key is kept in this page only and is never stored.</p>
<div class="row"><input id="k" type="password" placeholder="Admin key"></div>
<h2>Invite codes</h2><p>Each code works once. Codes are shown only now, so copy them before leaving this page.</p>
<div class="row"><input id="n" type="number" value="5" min="1" max="50" style="width:80px" aria-label="how many"><input id="nt" placeholder="Note (optional), e.g. Year 3 class"><button id="mk">Create codes</button><button id="cp">Copy</button></div>
<pre id="cd"></pre>
<h2>Students</h2><div class="row"><input id="u" placeholder="username"><input id="d" type="number" value="30" style="width:80px" aria-label="days"></div>
<div class="row"><button data-a="lookup">Look up</button><button data-a="grant" data-p="pro">Grant Pro</button><button data-a="grant" data-p="ultra">Grant Ultra</button><button data-a="revoke">Revoke</button></div>
<pre id="o"></pre>
<h2>Feedback</h2><div class="row"><button id="f">Load latest feedback</button></div><div id="fl"></div>
<script>
const $=id=>document.getElementById(id);
async function call(body){const r=await fetch('/api/admin',{method:'POST',headers:{'Content-Type':'application/json','x-admin-key':$('k').value},body:JSON.stringify(body)});return r.json();}
document.querySelectorAll('button[data-a]').forEach(b=>b.onclick=async()=>{$('o').textContent='…';const j=await call({action:b.dataset.a,plan:b.dataset.p,username:$('u').value,days:+$('d').value});$('o').textContent=JSON.stringify(j,null,2);});
$('mk').onclick=async()=>{$('cd').textContent='…';const j=await call({action:'newcodes',count:+$('n').value,note:$('nt').value});$('cd').textContent=j.codes?j.codes.join('\n'):(j.error||'Failed');};
$('cp').onclick=()=>{navigator.clipboard.writeText($('cd').textContent);};
$('f').onclick=async()=>{const j=await call({action:'feedback',limit:200}),l=$('fl');l.textContent='';if(j.error){l.textContent=j.error;return;}
 const h=document.createElement('p');h.textContent='👍 '+j.up+'   👎 '+j.down+' (latest '+j.items.length+')';l.append(h);
 j.items.forEach(x=>{const d=document.createElement('div');d.className='fb';const s=document.createElement('small');s.textContent=(x.v==='down'?'👎 ':'👍 ')+(x.why?x.why+' · ':'')+x.mode+' · '+new Date(x.t).toLocaleString();const q=document.createElement('div');q.textContent='Q: '+x.q;const a=document.createElement('div');a.textContent='A: '+x.a;d.append(s,q,a);l.append(d);});};
</script></body></html>
